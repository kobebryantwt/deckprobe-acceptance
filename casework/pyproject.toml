[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "casework-local"
version = "0.2.0"
description = "Local, project-independent sample and ground-truth maintenance"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
casework = "casework.cli:main"

[tool.setuptools.package-data]
casework = ["web/*"]

[tool.setuptools.packages.find]
include = ["casework*"]
