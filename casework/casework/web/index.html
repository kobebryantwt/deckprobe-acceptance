<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casework · 样本与 GT 管理</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">C <span>Casework<small>样本与 GT 管理</small></span></div><div class="top-controls"><select id="project" aria-label="项目"></select><label><span>操作者<span class="required-mark"> *</span></span><input id="actor" required placeholder="填写你的姓名"></label><button id="refresh">刷新</button><button id="approve-all" class="primary">一键审核全部</button><a id="export" href="#">导出项目</a><button id="apply" hidden>同步到验收</button></div></header>
<div id="toast" role="status" hidden></div>
<main><section class="intro"><div><small>LOCAL WORKSPACE</small><h1 id="project-title">正在加载…</h1><p>按样本用途维护 GT；参考取证不计入待审和执行。答案与范围修改均保留历史。</p></div><button id="add" class="primary">＋ 添加样本</button></section><div id="stats" class="stats"></div>
<div class="workspace"><aside><label class="search">搜索样本或问题<input id="search" placeholder="文件名、格式、场景、问题…"></label><div class="filters"><select id="format" aria-label="文件类型"><option value="all">全部格式</option></select><select id="state" aria-label="维护状态"><option value="all">全部维护范围</option><option value="active">启用中</option><option value="inactive">已停用</option><option value="no_gt">缺少专用 GT</option><option value="unknown">含待核定答案</option><option value="unmapped">含未映射事实</option><option value="pending">待审核 / 待重核</option><option value="approved">含已批准 GT</option><option value="missing">文件缺失 / 变化</option></select></div><div id="sample-count"></div><div id="samples"></div></aside><section id="detail" class="detail"><div class="empty">选择左侧样本，查看全部 GT 与维护历史。</div></section></div></main>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title"></h2><button type="button" id="close">关闭</button></div><p class="form-hint"><span class="required-mark">*</span> 为必填项，其余选填。</p><div id="edit-fields"></div><label>操作原因 / 依据说明（选填）<textarea id="edit-note" placeholder="可补充本次操作的原因，不填也可保存"></textarea></label><div id="form-error" class="error"></div><button type="submit" class="primary" id="save">保存</button></form></dialog>
<dialog id="history"><div class="dialog-head"><h2>版本历史</h2><button id="history-close">关闭</button></div><div id="history-content"></div></dialog>
<script src="/app.js"></script></body></html>
