name: Setup DeckProbe acceptance
description: Install the portable acceptance runtime without building DeckProbe
inputs:
  browser:
    description: Install Chromium for browser and Worker checks
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: benchmark/acceptance/requirements.txt
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24"
    - name: Install acceptance dependencies
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -r benchmark/acceptance/requirements.txt
        python -m pip install --disable-pip-version-check -e casework
    - name: Cache Playwright Chromium
      if: inputs.browser == 'true' && runner.os == 'Linux'
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-1.62.1
    - name: Install Chromium system dependencies
      if: inputs.browser == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          npx --yes playwright@1.62.1 install-deps chromium
        else
          npx --yes playwright@1.62.1 install --with-deps chromium
        fi

