name: Setup DeckProbe acceptance
description: Install the portable acceptance runtime without building DeckProbe
inputs:
  browser:
    description: Install Chromium for browser and Worker checks
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: benchmark/acceptance/requirements.txt
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24"
    - name: Install acceptance dependencies
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -r benchmark/acceptance/requirements.txt
        python -m pip install --disable-pip-version-check -e casework
    - name: Install Chromium system dependencies
      if: inputs.browser == 'true' && runner.os == 'Linux'
      shell: bash
      run: npx --yes playwright@1.62.1 install --with-deps chromium

